
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gallery | Rhodbert</title>
    <link rel="stylesheet" href="style.css">

    <style>
        /* Keep the original single-column gallery */
        .gallery {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            width: 100%;
            max-width: 700px;
            margin: 25px auto;
        }

        .gallery-item {
            width: 100%;
            margin: 0;
            box-sizing: border-box;
            text-align: center;
        }

        .gallery-item > .thumbnail {
            display: block;
            width: 100%;
            height: auto;
            max-height: 450px;
            object-fit: cover;
            border-radius: 16px;
            cursor: pointer;
        }

        .gallery-item figcaption {
            padding: 12px 4px;
            text-align: center;
            font-size: 20px;
        }

        /* Only Gala with Friends has two photos */
        .photo-pair {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .photo-pair .thumbnail {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 14px;
            cursor: pointer;
        }

        .thumbnail {
            transition: transform .25s, box-shadow .25s;
        }

        .thumbnail:hover {
            transform: scale(1.02);
            box-shadow: 0 0 12px #00cfff;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 99999;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .94);
            align-items: center;
            justify-content: center;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            display: block;
            max-width: 78%;
            max-height: 78vh;
            object-fit: contain;
            border-radius: 12px;
        }

        .lightbox button {
            position: absolute;
            border: none;
            border-radius: 10px;
            padding: 8px 15px;
            background: rgba(255, 255, 255, .18);
            color: white;
            font-size: 30px;
            cursor: pointer;
        }

        .lightbox .close {
            top: 15px;
            right: 18px;
        }

        .lightbox .prev {
            left: 10px;
        }

        .lightbox .next {
            right: 10px;
        }

        #lightboxCount {
            position: absolute;
            bottom: 15px;
            color: white;
            font-size: 16px;
        }

        @media (max-width: 480px) {
            .gallery {
                gap: 20px;
            }

            .photo-pair .thumbnail {
                height: 145px;
            }

            .gallery-item figcaption {
                font-size: 19px;
            }

            .lightbox-content {
                max-width: 82%;
                max-height: 72vh;
            }
        }
    </style>
</head>

<body>

<header>
    <img src="IMAGES/1.jpg" alt="My photo">
    <h1>Welcome to My Website</h1>
</header>

<nav>
    <ul>
        <li><a href="index.html">HOME</a></li>

        <li class="dropdown">
            <a href="#">ABOUT ▾</a>
            <div class="dropdown-content">
                <a href="skills.html">Skills I'm Developing</a>
                <a href="goals.html">My Goals as a Student</a>
                <a href="funfacts.html">Fun Facts About Me</a>
            </div>
        </li>

        <li><a href="gallery.html">GALLERY</a></li>
        <li><a href="contact.html">CONTACT</a></li>

        <li>
            <a href="#" class="logout-button"
               onclick="confirmLogout(); return false;">
                LOG OUT
            </a>
        </li>
    </ul>
</nav>

<main>
    <section>
        <h2>❄️ My Photo Gallery ❄️</h2>

        <p style="text-align:center">
            Six gallery items — click a photo to view it!
        </p>

        <div class="gallery">

            <!-- IMAGE 1 -->
            <figure class="gallery-item">
                <img src="IMAGES/1.jpg"
                     alt="Gallery image 1"
                     class="thumbnail"
                     onclick="openLightbox(0)">
                <figcaption>Image 1</figcaption>
            </figure>

            <!-- IMAGE 2 -->
            <figure class="gallery-item">
                <img src="IMAGES/2.jpg"
                     alt="Celebrating my birthday"
                     class="thumbnail"
                     onclick="openLightbox(1)">
                <figcaption>Celebrating my birthday</figcaption>
            </figure>

            <!-- IMAGE 3 -->
            <figure class="gallery-item">
                <img src="IMAGES/3.jpg"
                     alt="My pandemic era"
                     class="thumbnail"
                     onclick="openLightbox(2)">
                <figcaption>MY PANDEMIC ERA</figcaption>
            </figure>

            <!-- IMAGE 4: TWO GALA PHOTOS -->
            <figure class="gallery-item">
                <div class="photo-pair">
                    <img src="IMAGES/4.jpg"
                         alt="Gala with friends photo 1"
                         class="thumbnail"
                         onclick="openLightbox(3)">

                    <img src="IMAGES/4b.jpg"
                         alt="Gala with friends photo 2"
                         class="thumbnail"
                         onclick="openLightbox(4)">
                </div>

                <figcaption>gala with friends</figcaption>
            </figure>

            <!-- IMAGE 5: ONE PHOTO ONLY -->
            <figure class="gallery-item">
                <img src="IMAGES/5.jpg"
                     alt="Playing ML in a school tournament"
                     class="thumbnail"
                     onclick="openLightbox(5)">
                <figcaption>
                    Competing in a school ML tournament
                </figcaption>
            </figure>

            <!-- IMAGE 6 -->
            <figure class="gallery-item">
                <img src="IMAGES/6.jpg"
                     alt="High school graduation"
                     class="thumbnail"
                     onclick="openLightbox(6)">
                <figcaption>Graduate highschool haha</figcaption>
            </figure>

        </div>
    </section>
</main>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox"
     onclick="if(event.target === this) closeLightbox()">

    <button class="close"
            aria-label="Close"
            onclick="closeLightbox()">&times;</button>

    <button class="prev"
            aria-label="Previous photo"
            onclick="changeImage(-1)">&#10094;</button>

    <img id="lightboxImage"
         class="lightbox-content"
         src=""
         alt="Expanded photo">

    <button class="next"
            aria-label="Next photo"
            onclick="changeImage(1)">&#10095;</button>

    <span id="lightboxCount"></span>
</div>

<footer>
    ❄️ © 2026 Rhodbert Flores | My Ice World ❄️
</footer>

<script src="script.js"></script>

<script>
    const galleryPhotos = [
        { src: "IMAGES/1.jpg", alt: "Gallery image 1" },
        { src: "IMAGES/2.jpg", alt: "Birthday celebration" },
        { src: "IMAGES/3.jpg", alt: "Pandemic era" },
        { src: "IMAGES/4.jpg", alt: "Gala with friends photo 1" },
        { src: "IMAGES/4b.jpg", alt: "Gala with friends photo 2" },
        { src: "IMAGES/5.jpg", alt: "ML school tournament" },
        { src: "IMAGES/6.jpg", alt: "High school graduation" }
    ];

    let currentPhoto = 0;

    function openLightbox(index) {
        currentPhoto = index;
        showPhoto();

        document.getElementById("lightbox")
            .classList.add("active");

        document.body.style.overflow = "hidden";
    }

    function showPhoto() {
        const photo = galleryPhotos[currentPhoto];

        document.getElementById("lightboxImage").src = photo.src;
        document.getElementById("lightboxImage").alt = photo.alt;

        document.getElementById("lightboxCount").textContent =
            (currentPhoto + 1) + " / " + galleryPhotos.length;
    }

    function changeImage(direction) {
        currentPhoto =
            (currentPhoto + direction + galleryPhotos.length)
            % galleryPhotos.length;

        showPhoto();
    }

    function closeLightbox() {
        document.getElementById("lightbox")
            .classList.remove("active");

        document.body.style.overflow = "";
    }

    document.addEventListener("keydown", function(event) {
        const lightbox = document.getElementById("lightbox");

        if (!lightbox.classList.contains("active")) return;

        if (event.key === "Escape") closeLightbox();
        if (event.key === "ArrowRight") changeImage(1);
        if (event.key === "ArrowLeft") changeImage(-1);
    });
</script>

</body>
</html>
