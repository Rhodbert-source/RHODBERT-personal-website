<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contact | Rhodbert</title><link rel="stylesheet" href="style.css"></head><body><header><img src="IMAGES/1.jpg" alt="Icy image"><h1>Welcome to My Website</h1></header><nav><ul><li><a href="index.html">HOME</a></li><li class="dropdown"><a href="#">ABOUT ▾</a><div class="dropdown-content"><a href="skills.html">Skills I'm Developing</a><a href="goals.html">My Goals as a Student</a><a href="funfacts.html">Fun Facts About Me</a></div></li><li><a href="gallery.html">GALLERY</a></li><li><a href="contact.html">CONTACT</a></li><li><a href="#" class="logout-button" onclick="confirmLogout();return false">LOG OUT</a></li></ul></nav><main><section><h2>❄️ Let's Get in Touch ❄️</h2><div class="contact-layout"><form id="contactForm" class="contact-form" novalidate><label for="name">Your Name</label><input id="name"><span class="error" id="nameError"></span><label for="email">Email</label><input id="email" type="email"><span class="error" id="emailError"></span><label for="message">Message</label><textarea id="message" rows="5"></textarea><span class="error" id="messageError"></span><button type="submit">SEND MESSAGE</button></form><aside class="contact-details"><h3>Contact Me</h3><p><b>Email Address</b><br>Supermangchicks@email.com</p><hr><p>Philippines</p></aside></div></section></main><footer>❄️ © 2026 Rhodbert Flores | My Ice World ❄️</footer><script src="script.js"></script><script>document.getElementById('contactForm').addEventListener('submit',e=>{e.preventDefault();let ok=true,n=document.getElementById('name'),em=document.getElementById('email'),m=document.getElementById('message');document.querySelectorAll('.error').forEach(x=>x.textContent='');if(!n.value.trim()){document.getElementById('nameError').textContent='Name is required';ok=false}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em.value.trim())){document.getElementById('emailError').textContent='Enter a valid email';ok=false}if(!m.value.trim()){document.getElementById('messageError').textContent='Message is required';ok=false}if(ok){alert('Form validated! This demo does not send email.');e.target.reset()}})</script></body></html>
